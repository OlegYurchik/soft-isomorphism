repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.23.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: make-check
        name: make check
        entry: make check
        language: python3
        pass_filenames: false
        always_run: true
