services:
  rag:
    image: ghcr.io/hkuds/lightrag:latest
    ports:
      - "9621:9621"
    volumes:
      - rag-data:/app/data/rag_storage
      - ./inputs:/app/data/inputs
      - ./.env:/app/.env
    environment:
      HOST: "0.0.0.0"
      PORT: "9621"
      WORKING_DIR: "/app/data/rag_storage"
      INPUT_DIR: "/app/data/inputs"
      LIGHTRAG_GRAPH_STORAGE: "Neo4JStorage"
      NEO4J_URI: "bolt://database:7687"
      NEO4J_USERNAME: "neo4j"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-lightrag}"
      NEO4J_DATABASE: "neo4j"
    depends_on:
      database:
        condition: service_started
    restart: unless-stopped

  database:
    image: neo4j:5
    volumes:
      - database-data:/data
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-lightrag}"
    restart: unless-stopped

volumes:
  rag-data:
  database-data:
